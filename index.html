<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Dynamic Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">TaskFlow</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-filter="all">Dashboard</button>
      <button class="nav-item" data-filter="all-tasks">All Tasks</button>
      <button class="nav-item" data-filter="active">Active Tasks</button>
      <button class="nav-item" data-filter="completed">Completed Tasks</button>
      <button class="nav-item" data-filter="work">Work</button>
      <button class="nav-item" data-filter="personal">Personal</button>
      <button class="nav-item" data-filter="study">Study</button>
      <button class="nav-item" data-filter="other">Other</button>
      <button class="nav-item" data-filter="high">High Priority</button>
      <button class="nav-item" data-filter="medium">Medium Priority</button>
      <button class="nav-item" data-filter="low">Low Priority</button>
      <button class="nav-item" data-filter="overdue">Overdue Tasks</button>
    </nav>
    <div class="sidebar-footer">
      <button id="themeToggle" class="theme-toggle">Toggle Theme</button>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-left">
        <button id="menuToggle" class="menu-toggle">☰</button>
        <div>
          <h1>Welcome Back!</h1>
          <p class="date" id="currentDate"></p>
          <p class="productivity-msg">Stay productive and keep crushing your goals.</p>
        </div>
      </div>
      <div class="header-right">
        <input type="search" id="searchInput" placeholder="Search tasks..." class="search-bar">
        <button id="addTaskBtn" class="btn btn-primary">+ Add New Task</button>
      </div>
    </header>

    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Tasks</span>
        <span class="stat-value" id="statTotal">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Active Tasks</span>
        <span class="stat-value" id="statActive">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Completed Tasks</span>
        <span class="stat-value" id="statCompleted">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending Tasks</span>
        <span class="stat-value" id="statPending">0</span>
      </div>
    </section>

    <section class="form-section" id="formSection" hidden>
      <form id="taskForm" class="task-form">
        <h2>Add New Task</h2>
        <label>Title *
          <input type="text" id="taskTitle" required>
        </label>
        <label>Description
          <textarea id="taskDesc"></textarea>
        </label>
        <label>Category
          <select id="taskCategory">
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Study">Study</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label>Due Date
          <input type="date" id="taskDue">
        </label>
        <label>Priority
          <select id="taskPriority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add Task</button>
          <button type="button" id="cancelForm" class="btn btn-ghost">Cancel</button>
        </div>
      </form>
    </section>

    <section class="tasks-section">
      <div class="tasks-header">
        <h2>Tasks</h2>
        <button id="clearCompleted" class="btn btn-ghost">Clear Completed</button>
      </div>
      <div id="tasksContainer" class="tasks-container"></div>
      <div id="emptyState" class="empty-state" hidden>
        <p>No tasks yet. Add your first task to get started!</p>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/script.js"></script>
</body>
</html>
